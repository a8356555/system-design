# Flink Configuration for Dcard Post Tracking

# Job Manager Configuration
jobmanager.rpc.address: localhost
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 2048m
jobmanager.memory.flink.size: 1600m

# Task Manager Configuration  
taskmanager.numberOfTaskSlots: 8
taskmanager.memory.process.size: 4096m
taskmanager.memory.flink.size: 3200m
taskmanager.memory.managed.fraction: 0.4

# High Availability Configuration
high-availability: zookeeper
high-availability.zookeeper.quorum: localhost:2181
high-availability.storageDir: file:///var/flink/ha

# Checkpointing Configuration
execution.checkpointing.interval: 60s
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.timeout: 10min
execution.checkpointing.min-pause: 30s
execution.checkpointing.max-concurrent-checkpoints: 1
execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

# State Backend Configuration
state.backend: rocksdb
state.checkpoints.dir: file:///var/flink/checkpoints
state.savepoints.dir: file:///var/flink/savepoints
state.backend.incremental: true
state.backend.rocksdb.memory.managed: true

# Network Configuration
taskmanager.network.memory.fraction: 0.1
taskmanager.network.memory.max: 1gb
taskmanager.network.memory.min: 64mb

# Parallelism Configuration
parallelism.default: 512
slot.request.timeout: 300000

# Restart Strategy
restart-strategy: fixed-delay
restart-strategy.fixed-delay.attempts: 10
restart-strategy.fixed-delay.delay: 30s

# Metrics Configuration
metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
metrics.reporter.prom.host: localhost
metrics.reporter.prom.port: 9249

# Logging Configuration
rootLogger.level: INFO
logger.akka.level: WARN
logger.kafka.level: WARN
logger.hadoop.level: WARN
logger.zookeeper.level: WARN

# Security Configuration (if needed)
# security.ssl.enabled: true
# security.ssl.keystore: /path/to/keystore
# security.ssl.truststore: /path/to/truststore