version: '3.8'

services:
  # ============ LOAD BALANCER ============
  
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "8080:8080"  # Admin interface
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api-1
      - api-2
      - api-3
    restart: unless-stopped

  # ============ API LAYER (HORIZONTALLY SCALED) ============
  
  api-1:
    build: .
    environment: &api-env
      INSTANCE_ID: api-1
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9093
      REDIS_CLUSTER_NODES: redis-1:7000,redis-2:7001,redis-3:7002
      CLICKHOUSE_HOSTS: clickhouse-1:9000,clickhouse-2:9000
      ELASTICSEARCH_HOSTS: elasticsearch:9200
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      PYTHONPATH: /app
    command: python main.py api
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-2:
    build: .
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
    command: python main.py api
    volumes:
      - .:/app
    restart: unless-stopped

  api-3:
    build: .
    environment:
      <<: *api-env
      INSTANCE_ID: api-3
    command: python main.py api
    volumes:
      - .:/app
    restart: unless-stopped

  # ============ STREAM PROCESSING (PYTHON) ============
  
  stream-processor-1:
    build: .
    environment:
      <<: *api-env
      PROCESSOR_ID: processor-1
    command: python main.py processors
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - kafka-1
      - kafka-2
      - redis-1
      - clickhouse-1

  stream-processor-2:
    build: .
    environment:
      <<: *api-env
      PROCESSOR_ID: processor-2
    command: python main.py processors
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - kafka-1
      - kafka-2
      - redis-1
      - clickhouse-1

  # ============ MESSAGE STREAMING ============
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
    restart: unless-stopped

  kafka-1:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: snappy
    volumes:
      - kafka1_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    restart: unless-stopped

  kafka-2:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: snappy
    volumes:
      - kafka2_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    restart: unless-stopped

  # ============ HOT STORAGE (REDIS CLUSTER) ============
  
  redis-1:
    image: redis:7.0-alpine
    ports:
      - "7000:7000"
    command: >
      redis-server
      --port 7000
      --cluster-enabled yes
      --cluster-config-file nodes-7000.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis1_data:/data
    restart: unless-stopped

  redis-2:
    image: redis:7.0-alpine
    ports:
      - "7001:7001"
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes-7001.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis2_data:/data
    restart: unless-stopped

  redis-3:
    image: redis:7.0-alpine
    ports:
      - "7002:7002"
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes-7002.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis3_data:/data
    restart: unless-stopped

  # Redis cluster init (runs once to create cluster)
  redis-cluster-init:
    image: redis:7.0-alpine
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    command: >
      sh -c "
        sleep 10 &&
        redis-cli --cluster create
        redis-1:7000 redis-2:7001 redis-3:7002
        --cluster-replicas 0 --cluster-yes
      "
    restart: "no"

  # ============ WARM STORAGE (CLICKHOUSE) ============
  
  clickhouse-1:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "9000:9000"
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse1_data:/var/lib/clickhouse
      - ./configs/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./configs/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./configs/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  clickhouse-2:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "9001:9000"
      - "8124:8123"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse2_data:/var/lib/clickhouse
      - ./configs/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./configs/clickhouse/users.xml:/etc/clickhouse-server/users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  # ============ COLD STORAGE (MINIO) ============
  
  minio:
    image: minio/minio:RELEASE.2023-09-16T01-01-47Z
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============ SEARCH STORAGE (ELASTICSEARCH) ============
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============ MONITORING STACK ============
  
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    depends_on:
      - prometheus

  # ============ MANAGEMENT TOOLS ============
  
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9093
    depends_on:
      - kafka-1
      - kafka-2
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=redis-1:redis-1:7000,redis-2:redis-2:7001,redis-3:redis-3:7002
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    restart: unless-stopped

volumes:
  # Kafka & Zookeeper
  zk_data:
  kafka1_data:
  kafka2_data:
  
  # Redis
  redis1_data:
  redis2_data:
  redis3_data:
  
  # ClickHouse
  clickhouse1_data:
  clickhouse2_data:
  
  # MinIO
  minio_data:
  
  # Elasticsearch
  es_data:
  
  # Monitoring
  prometheus_data:
  grafana_data:

networks:
  default:
    name: analytics-network