# CDN Edge Server Configuration for Live Streaming Platform

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Optimize for high concurrent connections
events {
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging format for analytics
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   '$request_time $upstream_response_time';
    
    log_format stream_access '$remote_addr - [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" stream_key="$arg_stream" '
                            'quality="$arg_quality" cdn_pop="$server_name"';
    
    access_log /var/log/nginx/access.log main;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Rate limiting for API endpoints
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=streaming:10m rate=100r/s;
    
    # Connection limiting for streaming
    limit_conn_zone $binary_remote_addr zone=concurrent_streams:10m;
    
    # Upstream servers for load balancing
    upstream origin_servers {
        least_conn;
        server origin1.internal:8080 max_fails=3 fail_timeout=30s;
        server origin2.internal:8080 max_fails=3 fail_timeout=30s;
        server origin3.internal:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream chat_servers {
        least_conn;
        server chat1.internal:3000 max_fails=3 fail_timeout=30s;
        server chat2.internal:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Proxy cache configuration
    proxy_cache_path /var/cache/nginx/streams levels=1:2 keys_zone=stream_cache:100m
                     max_size=10g inactive=24h use_temp_path=off;
    
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                     max_size=1g inactive=1h use_temp_path=off;
    
    # Main streaming server
    server {
        listen 80;
        listen 443 ssl http2;
        server_name streaming.example.com *.streaming.example.com;
        
        # SSL certificates
        ssl_certificate /etc/ssl/certs/streaming.crt;
        ssl_certificate_key /etc/ssl/private/streaming.key;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        
        # CORS headers for streaming
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
        add_header Access-Control-Max-Age 3600;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        # HLS streaming endpoint
        location /hls/ {
            access_log /var/log/nginx/stream_access.log stream_access;
            limit_conn concurrent_streams 5;
            limit_req zone=streaming burst=20 nodelay;
            
            # Cache HLS segments
            proxy_cache stream_cache;
            proxy_cache_valid 200 302 10s;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_bypass $http_cache_control;
            
            # Proxy to origin servers
            proxy_pass http://origin_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Optimize for streaming
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Stream-specific headers
            add_header Cache-Control "no-cache, no-store";
            add_header X-CDN-Pop $server_name;
            
            # Handle different file types
            location ~* \.m3u8$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
            
            location ~* \.ts$ {
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
        }
        
        # DASH streaming endpoint
        location /dash/ {
            access_log /var/log/nginx/stream_access.log stream_access;
            limit_conn concurrent_streams 5;
            limit_req zone=streaming burst=20 nodelay;
            
            proxy_cache stream_cache;
            proxy_cache_valid 200 302 10s;
            proxy_cache_valid 404 1m;
            
            proxy_pass http://origin_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            add_header Cache-Control "no-cache, no-store";
            add_header X-CDN-Pop $server_name;
            
            location ~* \.mpd$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
            
            location ~* \.(m4s|mp4)$ {
                expires 1h;
                add_header Cache-Control "public, immutable";
            }
        }
        
        # WebRTC signaling for ultra-low latency
        location /webrtc/ {
            proxy_pass http://origin_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific settings
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
        }
        
        # Chat WebSocket endpoint
        location /chat/ws {
            proxy_pass http://chat_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        
        # API endpoints
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            
            proxy_cache api_cache;
            proxy_cache_valid 200 302 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $http_cache_control;
            
            proxy_pass http://origin_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API response headers
            add_header X-CDN-Pop $server_name;
            add_header X-Cache-Status $upstream_cache_status;
        }
        
        # Static assets (thumbnails, avatars, etc.)
        location /static/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-CDN-Pop $server_name;
            
            proxy_cache stream_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1h;
            
            proxy_pass http://origin_servers;
            proxy_set_header Host $host;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Metrics endpoint for monitoring
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            
            proxy_pass http://origin_servers;
            proxy_set_header Host $host;
        }
        
        # Default location
        location / {
            return 301 https://www.example.com$request_uri;
        }
    }
    
    # Admin interface server
    server {
        listen 8081;
        server_name admin.streaming.example.com;
        
        # Basic auth for admin interface
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        # Admin API
        location /admin/ {
            proxy_pass http://origin_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Nginx status for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }
        
        # Real-time streaming stats
        location /streaming_stats {
            proxy_pass http://origin_servers/api/admin/stats;
            proxy_set_header Host $host;
        }
    }
    
    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name streaming.example.com *.streaming.example.com;
        return 301 https://$server_name$request_uri;
    }
}

# Stream processing for analytics
stream {
    # Log format for stream analytics
    log_format stream_analytics '$remote_addr [$time_local] $protocol $bytes_sent $bytes_received $session_time';
    
    # Upstream for stream analytics
    upstream analytics_servers {
        server analytics1.internal:9092;
        server analytics2.internal:9092;
    }
    
    # Stream analytics proxy
    server {
        listen 9093;
        proxy_pass analytics_servers;
        proxy_timeout 10s;
        proxy_responses 1;
        access_log /var/log/nginx/stream_analytics.log stream_analytics;
    }
}