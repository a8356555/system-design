version: '3.8'

services:
  # Apache Flink JobManager with Python support
  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.pyflink
    hostname: flink-jobmanager
    expose:
      - "6123"
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address:flink-jobmanager
        jobmanager.memory.process.size:2048m
        taskmanager.memory.process.size:4096m
        taskmanager.numberOfTaskSlots:8
        parallelism.default:4
        state.backend:rocksdb
        state.checkpoints.dir:file:///tmp/flink-checkpoints
        state.savepoints.dir:file:///tmp/flink-savepoints
        execution.checkpointing.interval:10s
        execution.checkpointing.mode:EXACTLY_ONCE
        execution.checkpointing.timeout:60s
        execution.checkpointing.min-pause:5s
        taskmanager.memory.managed.fraction:0.4
        web.submit.enable:true
        python.executable:/opt/miniconda3/bin/python
        python.client.executable:/opt/miniconda3/bin/python
        python.archives:file:///opt/python_env.zip
        python.files:/opt/python_env.zip
        classloader.resolve-order:parent-first
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
      - ./src:/opt/src
      - ./config:/opt/config
    networks:
      - analytics-network

  # Apache Flink TaskManager with Python support
  flink-taskmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.pyflink
    hostname: flink-taskmanager-1
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: 2
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address:flink-jobmanager
        taskmanager.memory.process.size:4096m
        taskmanager.numberOfTaskSlots:8
        taskmanager.memory.managed.fraction:0.4
        python.executable:/opt/miniconda3/bin/python
        python.client.executable:/opt/miniconda3/bin/python
        python.archives:file:///opt/python_env.zip
        classloader.resolve-order:parent-first
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
      - ./src:/opt/src
      - ./config:/opt/config
    networks:
      - analytics-network

  # Kafka Cluster
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - analytics-network

  kafka-1:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka-1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - analytics-network

  kafka-2:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka-2
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - analytics-network

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    depends_on:
      - kafka-1
      - kafka-2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: analytics-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: true
    networks:
      - analytics-network

  # Redis Cluster for Hot Storage
  redis-1:
    image: redis:7.0-alpine
    hostname: redis-1
    ports:
      - "7000:7000"
    command: >
      redis-server 
      --port 7000 
      --cluster-enabled yes 
      --cluster-config-file nodes.conf 
      --cluster-node-timeout 5000 
      --appendonly yes
    volumes:
      - redis-1-data:/data
    networks:
      - analytics-network

  redis-2:
    image: redis:7.0-alpine
    hostname: redis-2
    ports:
      - "7001:7001"
    command: >
      redis-server 
      --port 7001 
      --cluster-enabled yes 
      --cluster-config-file nodes.conf 
      --cluster-node-timeout 5000 
      --appendonly yes
    volumes:
      - redis-2-data:/data
    networks:
      - analytics-network

  redis-3:
    image: redis:7.0-alpine
    hostname: redis-3
    ports:
      - "7002:7002"
    command: >
      redis-server 
      --port 7002 
      --cluster-enabled yes 
      --cluster-config-file nodes.conf 
      --cluster-node-timeout 5000 
      --appendonly yes
    volumes:
      - redis-3-data:/data
    networks:
      - analytics-network

  # Redis Cluster Setup
  redis-cluster-setup:
    image: redis:7.0-alpine
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    command: >
      sh -c "
        sleep 10 &&
        redis-cli --cluster create 
        redis-1:7000 redis-2:7001 redis-3:7002 
        --cluster-replicas 0 --cluster-yes
      "
    networks:
      - analytics-network

  # ClickHouse for Warm Storage
  clickhouse-1:
    image: clickhouse/clickhouse-server:23.8
    hostname: clickhouse-1
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-1-data:/var/lib/clickhouse
      - ./config/clickhouse:/etc/clickhouse-server/config.d
    networks:
      - analytics-network

  # MinIO for Cold Storage
  minio:
    image: minio/minio:latest
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - analytics-network

  # Elasticsearch for Search Storage
  elasticsearch:
    image: elasticsearch:8.9.0
    hostname: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - analytics-network

  # FastAPI Event Gateway
  event-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    hostname: event-gateway
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093
      KAFKA_TOPIC: raw-events
      REDIS_CLUSTER_NODES: redis-1:7000,redis-2:7001,redis-3:7002
    depends_on:
      - kafka-1
      - kafka-2
      - redis-cluster-setup
    volumes:
      - ./gateway:/app
    networks:
      - analytics-network

  # Jupyter Notebook for Data Analysis
  jupyter:
    image: jupyter/scipy-notebook:latest
    hostname: jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "analytics123"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./src:/home/jovyan/src
      - jupyter-data:/home/jovyan/.jupyter
    command: start-notebook.sh --NotebookApp.token='analytics123' --NotebookApp.password=''
    networks:
      - analytics-network

  # Grafana for Monitoring
  grafana:
    image: grafana/grafana:10.0.0
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource,clickhouse-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning
    networks:
      - analytics-network

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - analytics-network

  # Job Submission Service
  job-submitter:
    build:
      context: .
      dockerfile: docker/Dockerfile.job-submitter
    hostname: job-submitter
    depends_on:
      - flink-jobmanager
      - kafka-1
      - redis-cluster-setup
    environment:
      FLINK_HOST: flink-jobmanager:8081
      KAFKA_SERVERS: kafka-1:29092,kafka-2:29093
      REDIS_NODES: redis-1:7000,redis-2:7001,redis-3:7002
      CLICKHOUSE_HOST: clickhouse-1:9000
    volumes:
      - ./src:/opt/src
      - ./scripts:/opt/scripts
    command: python /opt/scripts/submit_all_jobs.py
    networks:
      - analytics-network

volumes:
  flink-checkpoints:
  flink-savepoints:
  kafka-1-data:
  kafka-2-data:
  zookeeper-data:
  zookeeper-logs:
  redis-1-data:
  redis-2-data:
  redis-3-data:
  clickhouse-1-data:
  minio-data:
  elasticsearch-data:
  grafana-data:
  prometheus-data:
  jupyter-data:

networks:
  analytics-network:
    driver: bridge