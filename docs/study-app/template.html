<title>系統設計取捨手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: engineering decision-record binder — fixed index rail on the left, one decision per page on the right; options read as a spec sheet, cost and failure always visible. */
:root {
  --paper: #f2f4f6;
  --sheet: #ffffff;
  --ink: #16212c;
  --ink-2: #4a5866;
  --rule: #d5dce3;
  --blue: #1d4f91;
  --blue-wash: #e6eef8;
  --amber: #9a5b00;
  --amber-wash: #fbf1e1;
  --red: #a8322a;
  --red-wash: #f9e7e5;
  --green: #2c6a43;
  --green-wash: #e5f2ea;
  --violet: #5b4a9e;
  --violet-wash: #eeebf8;
  --shadow: 0 1px 2px rgba(22,33,44,.06), 0 4px 14px rgba(22,33,44,.05);
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --rail: 268px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --sheet: #161d25; --ink: #e2e8ee; --ink-2: #9aa8b6; --rule: #2a3542;
    --blue: #8db4ec; --blue-wash: #1a2a40; --amber: #e7b15a; --amber-wash: #2e2414;
    --red: #ef8f86; --red-wash: #34191a; --green: #7fcb98; --green-wash: #15291e;
    --violet: #b4a7ee; --violet-wash: #231f38; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --sheet: #161d25; --ink: #e2e8ee; --ink-2: #9aa8b6; --rule: #2a3542;
  --blue: #8db4ec; --blue-wash: #1a2a40; --amber: #e7b15a; --amber-wash: #2e2414;
  --red: #ef8f86; --red-wash: #34191a; --green: #7fcb98; --green-wash: #15291e;
  --violet: #b4a7ee; --violet-wash: #231f38; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
a { color: var(--blue); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); }

.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--rule); background: var(--sheet); padding-block: 20px 40px; padding-inline: 16px; }
.brand { font-family: var(--f-display); font-weight: 900; font-size: 20px; line-height: 1.25; letter-spacing: .01em; }
.brand small { display: block; font-family: var(--f-mono); font-weight: 400; font-size: 11px; color: var(--ink-2); letter-spacing: .06em; margin-top: 4px; }
.search { width: 100%; margin-block: 16px 8px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; }
.navsec { margin-top: 18px; }
.navsec h4 { margin: 0 0 6px; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.navlink { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 5px 8px; border-radius: 5px; font-size: 14px; cursor: pointer; color: var(--ink); text-decoration: none; }
.navlink:hover { background: var(--blue-wash); }
.navlink.on { background: var(--blue-wash); color: var(--blue); font-weight: 700; }
.navlink .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--rule); flex: none; }
.navlink .dot.done { background: var(--green); border-color: var(--green); }
.navlink .count { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); }
.themebtn { margin-top: 22px; font-size: 12px; background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--ink-2); }

main { min-width: 0; padding-block: 28px 80px; padding-inline: clamp(16px, 4vw, 56px); }
.page { max-width: 1060px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--ink-2); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.25; margin: 6px 0 10px; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 21px; margin: 36px 0 12px; text-wrap: balance; }
h3 { font-size: 16px; margin: 0; }
.lede { font-size: 17px; color: var(--ink-2); max-width: 65ch; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); cursor: default; }
button.chip, a.chip { cursor: pointer; text-decoration: none; }
button.chip:hover, a.chip:hover { border-color: var(--blue); color: var(--blue); }
button.chip.on { background: var(--blue); border-color: var(--blue); color: var(--sheet); }
.badge { font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 4px; letter-spacing: .03em; white-space: nowrap; }
.b-agents { background: var(--violet-wash); color: var(--violet); }
.b-premium { background: var(--amber-wash); color: var(--amber); }
.b-src { background: var(--blue-wash); color: var(--blue); }

.callout { border-left: 3px solid var(--blue); background: var(--sheet); padding: 12px 16px; border-radius: 0 6px 6px 0; margin-top: 18px; box-shadow: var(--shadow); }
.callout .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--blue); text-transform: uppercase; }
.callout p { margin: 2px 0 0; font-size: 16px; }

/* option spec sheets */
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.opt { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.opt-h { display: flex; gap: 10px; align-items: baseline; }
.opt-n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); flex: none; }
.opt-h h3 { font-size: 15.5px; line-height: 1.45; }
.opt .how { color: var(--ink-2); font-size: 14px; margin: 0; }
.row { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 8px; font-size: 14px; line-height: 1.6; }
.row .lbl { font-size: 11.5px; font-weight: 700; padding: 1px 0; border-radius: 4px; text-align: center; height: fit-content; }
.l-best { background: var(--green-wash); color: var(--green); }
.l-cost { background: var(--amber-wash); color: var(--amber); }
.l-fail { background: var(--red-wash); color: var(--red); }
.l-scale { background: var(--blue-wash); color: var(--blue); }
.viewtoggle { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; margin-left: 10px; vertical-align: middle; }
.viewtoggle button { border: 0; background: var(--sheet); padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.viewtoggle button.on { background: var(--blue); color: var(--sheet); }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
table.cmp { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 13.5px; line-height: 1.55; }
table.cmp th, table.cmp td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
table.cmp th { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .05em; color: var(--ink-2); font-weight: 600; background: var(--paper); position: sticky; top: 0; }
table.cmp td:first-child { font-weight: 700; min-width: 150px; }

/* decision guide */
.guide { display: grid; gap: 8px; }
.g { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1.1fr); gap: 0 10px; align-items: start; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; }
.g .if { font-size: 14px; }
.g .if::before { content: "如果 "; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); }
.g .arrow { color: var(--blue); font-family: var(--f-mono); text-align: center; padding-top: 2px; }
.g .then { font-weight: 700; color: var(--blue); font-size: 14px; }
.g .why { grid-column: 3; font-size: 13px; color: var(--ink-2); }

.script { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; position: relative; }
.script p { margin: 0; font-size: 15px; max-width: 70ch; }
.copy { position: absolute; top: 10px; right: 10px; font-size: 12px; border: 1px solid var(--rule); background: var(--paper); border-radius: 5px; padding: 1px 8px; cursor: pointer; }
.default { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
.default b { color: var(--green); white-space: nowrap; font-size: 13px; }
ul.plain { margin: 0; padding-left: 1.1em; }
ul.plain li { margin: 3px 0; }
.pitfall li::marker { content: "✕  "; color: var(--red); }

/* cases */
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-block: 14px; }
.filters .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters .grp > span { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); margin-right: 2px; }
.cases { display: grid; gap: 10px; }
details.case { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; }
details.case > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; }
details.case > summary::-webkit-details-marker { display: none; }
details.case > summary h3 { font-size: 16px; }
details.case > summary .core { grid-column: 1 / -1; color: var(--ink-2); font-size: 14px; }
details.case[open] > summary { border-bottom: 1px solid var(--rule); }
.case-body { padding: 14px 16px 18px; display: grid; gap: 14px; }
.dec { border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.dec-q { padding: 8px 12px; font-weight: 700; font-size: 14px; background: var(--paper); }
.dec-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.dec-yes, .dec-no { padding: 10px 12px; font-size: 13.5px; min-width: 0; }
.dec-yes { border-right: 1px solid var(--rule); }
.dec-yes .k { color: var(--green); }
.dec-no .k { color: var(--red); }
.dec .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; display: block; margin-bottom: 2px; }
.dec-no p { margin: 0 0 6px; }
.dec-no p b { color: var(--ink); }
.dec-t { padding: 8px 12px; font-size: 13px; background: var(--amber-wash); color: var(--ink); }
.dec-t::before { content: "取捨　"; font-weight: 700; color: var(--amber); }
.nums { display: flex; flex-wrap: wrap; gap: 6px; }
.num { font-family: var(--f-mono); font-size: 12px; background: var(--blue-wash); color: var(--blue); padding: 2px 8px; border-radius: 4px; }
.path { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); word-break: break-all; }

/* components */
.comps { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.comp { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.comp-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.comp-h h3 { font-family: var(--f-display); font-size: 19px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini h5 { margin: 0 0 2px; font-size: 11.5px; font-family: var(--f-mono); letter-spacing: .05em; }
.mini ul { margin: 0; padding-left: 1em; font-size: 13.5px; }
.h-g { color: var(--green); } .h-r { color: var(--red); } .h-b { color: var(--blue); } .h-a { color: var(--amber); }

/* quiz */
.qcard { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 22px 24px; box-shadow: var(--shadow); max-width: 760px; }
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.qq { font-size: 18px; font-weight: 500; line-height: 1.6; margin: 0; }
.qa { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--rule); font-size: 15px; }
.qbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.btn.pri { background: var(--blue); border-color: var(--blue); color: var(--sheet); }
.btn.ok { border-color: var(--green); color: var(--green); }
.btn.no { border-color: var(--red); color: var(--red); }
.progress { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.qlist details { border-bottom: 1px solid var(--rule); padding: 8px 0; }
.qlist summary { cursor: pointer; }

/* home */
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 8px; }
.group { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; }
.group h3 { font-family: var(--f-display); font-size: 17px; margin-bottom: 8px; }
.tlink { display: block; padding: 6px 0; border-top: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.tlink:first-of-type { border-top: 0; }
.tlink span { display: block; font-size: 13px; color: var(--ink-2); }
.tlink:hover b { color: var(--blue); }
.how3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 18px; }
.how3 div { border-top: 2px solid var(--ink); padding-top: 8px; font-size: 14px; }
.how3 b { display: block; font-family: var(--f-display); font-size: 16px; }
.done-toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; margin-top: 14px; cursor: pointer; }
.results a { display: block; padding: 8px 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.results a span { color: var(--ink-2); font-size: 13px; display: block; }
.empty { color: var(--ink-2); font-size: 14px; }

/* mechanisms */
.mechs { display: grid; gap: 14px; }
.mech { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.mech-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; justify-content: space-between; }
.mech-h h3 { font-family: var(--f-display); font-size: 18px; line-height: 1.45; }
.chain { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.chain > div { padding: 10px 12px; font-size: 13.5px; line-height: 1.6; border-right: 1px solid var(--rule); min-width: 0; }
.chain > div:last-child { border-right: 0; }
.chain .k { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; margin-bottom: 3px; font-weight: 600; }
.c-naive .k { color: var(--ink-2); }
.chain.inc { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.c-why { background: var(--violet-wash); } .c-why .k { color: var(--violet); }
.c-break { background: var(--red-wash); } .c-break .k { color: var(--red); }
.c-trick { background: var(--green-wash); } .c-trick .k { color: var(--green); }
.c-cost { background: var(--amber-wash); } .c-cost .k { color: var(--amber); }
.srcs { font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.use { font-size: 14px; border-left: 3px solid var(--blue); padding-left: 10px; }
.use b { color: var(--blue); font-size: 12px; margin-right: 6px; }

.menubtn { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); z-index: 20; transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .rail.open { transform: none; }
  .menubtn { display: inline-flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; margin: 0 0 12px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 5px 12px; font-size: 14px; cursor: pointer; }
  .dec-grid, .two { grid-template-columns: minmax(0, 1fr); }
  .dec-yes { border-right: 0; border-bottom: 1px solid var(--rule); }
  .g { grid-template-columns: minmax(0, 1fr); }
  .g .arrow { display: none; }
  .g .why { grid-column: 1; }
  .opts, .comps, .groups { grid-template-columns: minmax(0, 1fr); }
  .chain, .chain.inc { grid-template-columns: minmax(0, 1fr); }
  .chain > div { border-right: 0; border-bottom: 1px solid var(--rule); }
  .chain > div:last-child { border-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="目錄">
    <div class="brand">系統設計取捨手冊<small id="stats"></small></div>
    <input class="search" id="q" type="search" placeholder="搜尋主題、案例、元件…" autocomplete="off">
    <div id="nav"></div>
    <button class="themebtn" id="themebtn" type="button">切換深淺色</button>
  </nav>
  <main>
    <button class="menubtn" id="menubtn" type="button">☰ 目錄</button>
    <div class="page" id="view"></div>
  </main>
</div>

<script>
window.DATA = /*DATA*/null;
</script>
<script>
(function () {
  const D = window.DATA;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem("sdt:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("sdt:" + k, JSON.stringify(v)); } catch (e) {} },
  };
  const GROUPS = ["正確性", "擴展", "即時與非同步", "資料與查詢", "邊界與介面"];
  const DOMAINS = [
    ["video", "影音串流"], ["maps", "地圖與叫車"], ["connections", "連線與傳輸"], ["recsys", "推薦與排序"],
    ["moderation", "內容審核與反濫用"], ["data-pipeline", "資料管線"], ["deploy-migration", "部署與遷移"],
    ["observability", "觀測性與 SLO"], ["matching-engine", "交易撮合"], ["gaming", "線上遊戲"],
    ["audio", "音訊辨識與音樂"], ["collab", "即時協作"], ["delivery", "外送與物流"], ["ads", "廣告競價"],
    ["email", "電子郵件"], ["payments", "支付處理"], ["web-search", "網頁搜尋引擎"], ["iot", "物聯網"],
    ["classic", "經典領域機制"],
  ];
  D.problems = D.problems || [];
  D.incidents = D.incidents || [];
  for (const [id, name] of D.problems) DOMAINS.push([id, name]);
  const domainName = Object.fromEntries(DOMAINS);
  const problemName = Object.fromEntries(D.problems);
  D.mechanisms = D.mechanisms || [];
  const topicById = Object.fromEntries(D.topics.map((t) => [t.id, t]));
  const caseById = Object.fromEntries(D.cases.map((c) => [c.id, c]));
  const fileToCase = Object.fromEntries(D.cases.map((c) => [c.file, c.id]));
  let done = store.get("done", {});
  let known = store.get("known", {});

  function srcBadge(c) {
    if ((c.source || "").includes("Premium")) return '<span class="badge b-premium">Premium・細節為補充</span>';
    return '<span class="badge b-src">' + esc(c.source) + "</span>";
  }
  const agentsBadge = '<span class="badge b-agents" title="主要依據 by agents 撰寫的內容，非原文">by agents</span>';

  function nav(active) {
    const parts = [];
    parts.push('<div class="navsec"><a class="navlink' + (active === "home" ? " on" : "") + '" href="#home">總覽</a>');
    parts.push('<a class="navlink' + (active === "cases" ? " on" : "") + '" href="#cases">案例<span class="count">' + D.cases.length + "</span></a>");
    parts.push('<a class="navlink' + (active === "mech" ? " on" : "") + '" href="#mech">領域機制<span class="count">' + D.mechanisms.length + "</span></a>");
    if (D.incidents.length) parts.push('<a class="navlink' + (active === "inc" ? " on" : "") + '" href="#inc">真實事故<span class="count">' + D.incidents.length + "</span></a>");

  const shortTitle = (s) => s.replace(/（.*?）|\(.*?\)/g, "").trim();

    h += '<div class="how3"><div><b>1．讀一個決策主題</b>先看情境問句，再比較選項的代價與失效方式，最後背下預設答案與面試說法。</div><div><b>2．看案例怎麼選</b>每個案例列出被否決的方案與理由，練習說出「為什麼不選 B」。</div><div><b>3．用自測驗收</b>取捨題和情境題佔一半以上，答不出來的會被標記，下次優先出現。</div></div>';
    h += '<h2>決策主題　<span class="mono" style="font-size:13px;color:var(--ink-2)">已讀 ' + doneN + " / " + D.topics.length + "</span></h2>";

      const ts = D.topics.filter((t) => t.group === g);

      h += '<div class="group"><h3>' + esc(g) + "</h3>";
      for (const t of ts) h += '<a class="tlink" href="#topic-' + t.id + '"><b>' + esc(t.title) + (done[t.id] ? "　✓" : "") + "</b><span>" + esc(t.question) + "</span></a>";

    return h;
  }

  function relatedCases(t) {
    const ids = new Set();
    for (const c of t.cases || []) { const id = fileToCase[c.ref]; if (id) ids.add(id); }
    for (const c of D.cases) if ((c.topics || []).includes(t.id)) ids.add(c.id);
    return [...ids].map((id) => caseById[id]).filter(Boolean);
  }

  function optionsCards(t) {
    return '<div class="opts">' + t.options.map((o, i) =>
      '<div class="opt"><div class="opt-h"><span class="opt-n">' + String.fromCharCode(65 + i) + '</span><h3>' + esc(o.name) + '</h3></div>' +
      '<p class="how">' + esc(o.how) + "</p>" +
      '<div class="row"><span class="lbl l-best">適合</span><span>' + esc(o.bestWhen) + "</span></div>" +
      '<div class="row"><span class="lbl l-cost">代價</span><span>' + esc(o.cost) + "</span></div>" +
      '<div class="row"><span class="lbl l-fail">會壞</span><span>' + esc(o.failure) + "</span></div>" +
      (o.scale ? '<div class="row"><span class="lbl l-scale">規模</span><span>' + esc(o.scale) + "</span></div>" : "") +
      "</div>").join("") + "</div>";
  }

    h += '<h2>選項比較<span class="viewtoggle" role="group" aria-label="顯示方式"><button type="button" data-ov="cards" class="' + (mode === "cards" ? "on" : "") + '">卡片</button><button type="button" data-ov="table" class="' + (mode === "table" ? "on" : "") + '">表格</button></span></h2>';

      h += '<h2>怎麼決定</h2><div class="guide">' + t.decisionGuide.map((g) => '<div class="g"><div class="if">' + esc(g.if) + '</div><div class="arrow">→</div><div class="then">' + esc(g.then) + '</div><div class="why">' + esc(g.why) + "</div></div>").join("") + "</div>";

    h += '<p id="scriptText">' + esc(t.interviewScript) + '</p><button class="copy" type="button" id="copyScript">複製</button></div>';

      h += '<h2>實際案例怎麼選（' + rc.length + "）</h2><div class=\"cases\">" + rc.map((c) => caseCard(c, notes[c.id])).join("") + "</div>";

    const ri = D.incidents.filter((x) => (x.topics || []).includes(t.id));
    if (ri.length) h += '<h2>真實事故（' + ri.length + "）</h2><div class=\"results\">" + ri.map((x) => '<a href="#incitem-' + esc(x.id) + '"><b>' + esc(x.company) + "：" + esc(x.title) + "</b><span>" + esc(x.rootCause) + "</span></a>").join("") + "</div>";

    if (qs.length) h += '<h2>自測（' + qs.length + '）</h2><div class="qlist">' + qs.map((q) => "<details><summary>" + esc(q.q) + ' <span class="badge b-src">' + esc(q.kind) + '</span></summary><p>' + esc(q.a) + "</p></details>").join("") + "</div>";
    if (t.sources?.length) h += '<h2>延伸閱讀（repo 筆記）</h2>' + t.sources.map((s) => '<div class="path">docs/' + esc(s) + "</div>").join("");
    h += '<label class="done-toggle"><input type="checkbox" id="doneBox"' + (done[t.id] ? " checked" : "") + "> 標記為已讀</label>";

  function caseCard(c, note) {

    h += '<span class="core">' + esc(note ? note : c.core) + "</span></summary><div class=\"case-body\">";
    if (note) h += "<div><b>核心難點　</b>" + esc(c.core) + "</div>";
    if (c.scaleNumbers?.length) h += '<div class="nums">' + c.scaleNumbers.map((n) => '<span class="num">' + esc(n) + "</span>").join("") + "</div>";
    for (const d of c.decisions || []) {
      h += '<div class="dec"><div class="dec-q">' + esc(d.decision) + '</div><div class="dec-grid"><div class="dec-yes"><span class="k">選擇</span>' + esc(d.chosen) + '</div><div class="dec-no"><span class="k">不選</span>' + (d.rejected || []).map((r) => "<p><b>" + esc(r.option) + "</b>：" + esc(r.why) + "</p>").join("") + "</div></div>";

      h += "</div>";
    }
    if (c.followUps?.length) h += '<div><b>常見追問</b><ul class="plain">' + c.followUps.map((f) => "<li>" + esc(f) + "</li>").join("") + "</ul></div>";
    h += '<div class="chips">' + (c.topics || []).filter((x) => topicById[x]).map((x) => '<a class="chip" href="#topic-' + x + '">' + esc(shortTitle(topicById[x].title)) + "</a>").join("") + "</div>";
    h += '<div class="path">docs/' + esc(c.file) + (c.origin ? '　<a href="' + esc(c.origin) + '" target="_blank" rel="noopener">原文 ↗</a>' : "") + "</div>";
    return h + "</div></details>";
  }

  let caseFilter = { kind: "全部", topic: "" };
  function casesPage() {
    let h = '<div class="eyebrow">' + D.cases.length + ' 個案例</div><h1>案例：別人實際怎麼選</h1><p class="lede">每個案例只留決策：選了什麼、否決了什麼、為什麼，以及這個選擇的代價。</p>';

  let incProblem = "";
  function incPage(sel) {
    if (sel !== undefined) incProblem = sel;
    const companies = new Set(D.incidents.map((x) => x.company)).size;
    let h = '<div class="eyebrow">' + D.incidents.length + " 篇 ・ " + companies + ' 家公司</div><h1>真實事故：別人怎麼在線上解決問題</h1><p class="lede">從各家技術部落格與事故檢討整理，每篇都是「症狀 → 根因 → 為什麼難 → 修正 → 代價」。面試時用一個真實事故支撐你的設計選擇，比講原則更有說服力。</p>';
    h += '<div class="filters"><div class="grp"><span>問題類型</span><a class="chip' + (!incProblem ? " on" : "") + '" href="#inc">全部</a>' +
      D.problems.map(([id, name]) => '<a class="chip' + (incProblem === id ? " on" : "") + '" href="#inc-' + id + '">' + esc(name) + '<span class="mono" style="font-size:11px">' + D.incidents.filter((x) => x.problem === id).length + "</span></a>").join("") + "</div></div>";
    for (const [id, name] of D.problems.filter(([id]) => !incProblem || id === incProblem)) {
      const xs = D.incidents.filter((x) => x.problem === id);
      const rel = incProblem ? D.incidents.filter((x) => (x.alsoIn || []).includes(id)) : [];
      if (xs.length) h += "<h2>" + esc(name) + '</h2><div class="mechs">' + xs.map(incCard).join("") + "</div>";
      if (rel.length) h += "<h2>也跟「" + esc(name) + "」有關（" + rel.length + '）</h2><div class="results">' + rel.map((x) => '<a href="#incitem-' + esc(x.id) + '"><b>' + esc(x.company) + "：" + esc(x.title) + "</b><span>主要歸類：" + esc(problemName[x.problem] || x.problem) + "</span></a>").join("") + "</div>";
    }
    return h;
  }

  let quizState = { topic: "", kind: "", idx: 0, shown: false, order: [] };
  function quizPool() {
    return D.quiz.map((q, i) => ({ ...q, i })).filter((q) => (!quizState.topic || q.topic === quizState.topic) && (!quizState.kind || q.kind === quizState.kind));
  }
  function reorder() {
    const pool = quizPool();
    const weak = pool.filter((q) => known[q.i] === false), fresh = pool.filter((q) => known[q.i] === undefined), ok = pool.filter((q) => known[q.i] === true);
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    quizState.order = [...shuffle(weak), ...shuffle(fresh), ...shuffle(ok)].map((q) => q.i);
    quizState.idx = 0; quizState.shown = false;
  }
  function quizPage() {
    if (!quizState.order.length) reorder();
    const kinds = [...new Set(D.quiz.map((q) => q.kind))];
    let h = '<div class="eyebrow">' + D.quiz.length + ' 題</div><h1>自測</h1><p class="lede">先自己說出答案（包含為什麼不選另一個），再翻開對照。答不好的題會排到前面。</p>';
    h += '<div class="filters"><div class="grp"><span>題型</span><button type="button" class="chip' + (!quizState.kind ? " on" : "") + '" data-qkind="">全部</button>' + kinds.map((k) => '<button type="button" class="chip' + (quizState.kind === k ? " on" : "") + '" data-qkind="' + esc(k) + '">' + esc(k) + "</button>").join("") + "</div>";
    const domOpts = DOMAINS.filter(([id]) => D.quiz.some((q) => q.topic === id));
    h += '<div class="grp"><span>主題</span><select id="qtopic" class="chip" aria-label="主題篩選"><option value="">全部主題</option>' + D.topics.map((t) => '<option value="' + t.id + '"' + (quizState.topic === t.id ? " selected" : "") + ">" + esc(shortTitle(t.title)) + "</option>").join("") +
      (domOpts.length ? '<optgroup label="領域機制">' + domOpts.map(([id, name]) => '<option value="' + id + '"' + (quizState.topic === id ? " selected" : "") + ">" + esc(name) + "</option>").join("") + "</optgroup>" : "") + "</select></div></div>";
    const id = quizState.order[quizState.idx];
    const q = D.quiz[id];
    if (q === undefined) return h + '<p class="empty">這個篩選條件下沒有題目，換一個主題或題型。</p>';
    const t = topicById[q.topic];
    const dn = domainName[q.topic];
    h += '<div class="qcard"><div class="qmeta"><span class="badge b-src">' + esc(q.kind) + "</span>" + (t ? '<a class="chip" href="#topic-' + t.id + '">' + esc(shortTitle(t.title)) + "</a>" : "") + (dn ? '<a class="chip" href="#' + (problemName[q.topic] ? "inc-" : "mech-") + q.topic + '">' + esc(dn) + "</a>" : "") + (known[id] === false ? '<span class="badge b-premium">上次不熟</span>' : "") + '</div><p class="qq">' + esc(q.q) + "</p>";
    if (quizState.shown) h += '<div class="qa">' + esc(q.a) + "</div>";
    h += '<div class="qbtns">' + (quizState.shown ? '<button type="button" class="btn ok" data-mark="1">答得出來</button><button type="button" class="btn no" data-mark="0">還不熟</button>' : '<button type="button" class="btn pri" id="reveal">看答案</button>') + '<button type="button" class="btn" id="skip">下一題</button></div>';
    const pool = quizPool(); const okN = pool.filter((x) => known[x.i] === true).length;
    h += '<div class="progress">第 ' + (quizState.idx + 1) + " / " + quizState.order.length + " 題　・　這組答得出來 " + okN + " 題</div></div>";
    return h;
  }

  function searchPage(term) {
    const s = term.toLowerCase();
    const hit = (o) => JSON.stringify(o).toLowerCase().includes(s);
    const ts = D.topics.filter(hit), cs = D.cases.filter(hit), ps = D.components.filter(hit), ms = D.mechanisms.filter(hit), is = D.incidents.filter(hit);
    let h = '<div class="eyebrow">搜尋</div><h1>「' + esc(term) + "」</h1>";
    if (!ts.length && !cs.length && !ps.length && !ms.length && !is.length) return h + '<p class="empty">沒有找到，試試英文術語（例如 outbox、HNSW、fencing token）。</p>';
    h += '<div class="results">';
    for (const t of ts) h += '<a href="#topic-' + t.id + '"><b>主題・' + esc(t.title) + "</b><span>" + esc(t.oneLiner) + "</span></a>";
    for (const c of cs) h += '<a href="#case-' + c.id + '"><b>案例・' + esc(c.title) + "</b><span>" + esc(c.core) + "</span></a>";
    for (const c of ps) h += '<a href="#comp-' + c.id + '"><b>元件・' + esc(c.name) + "</b><span>" + esc(c.what) + "</span></a>";
    for (const x of is) h += '<a href="#incitem-' + esc(x.id) + '"><b>事故・' + esc(x.company) + "：" + esc(x.title) + "</b><span>" + esc(x.rootCause) + "</span></a>";
    for (const m of ms) h += '<a href="#mechitem-' + esc(m.id) + '"><b>機制・' + esc(m.title) + "</b><span>" + esc((m.apps || []).join("、") + "｜" + m.trick) + "</span></a>";
    return h + "</div>";
  }

  function render() {
    const hash = location.hash.slice(1) || "home";
    const term = $("#q").value.trim();
    let html, active = hash;
    if (term) { html = searchPage(term); active = ""; }
    else if (hash.startsWith("topic-")) html = topicPage(hash.slice(6));
    else if (hash === "cases") html = casesPage();
    else if (hash.startsWith("case-")) { caseFilter = { kind: "全部", topic: "" }; html = casesPage(); active = "cases"; }
    else if (hash === "components" || hash.startsWith("comp-")) { html = componentsPage(); active = "components"; }
    else if (hash === "inc" || hash.startsWith("incitem-")) { html = incPage(""); active = "inc"; }
    else if (hash.startsWith("inc-")) { html = incPage(hash.slice(4)); active = "inc"; }
    else if (hash === "mech") { html = mechPage(""); active = "mech"; }
    else if (hash.startsWith("mechitem-")) { html = mechPage(""); active = "mech"; }
    else if (hash.startsWith("mech-")) { html = mechPage(hash.slice(5)); active = "mech"; }
    else if (hash === "quiz") html = quizPage();
    else { html = home(); active = "home"; }
    $("#view").innerHTML = html;
    nav(active);
    if (hash.startsWith("case-") && !term) { const el = document.getElementById(hash); if (el) { el.open = true; el.scrollIntoView(); } }
    else if ((hash.startsWith("comp-") || hash.startsWith("mechitem-") || hash.startsWith("incitem-")) && !term) { const el = document.getElementById(hash); if (el) el.scrollIntoView(); }
    else window.scrollTo(0, 0);
    $("#rail").classList.remove("open");
    store.set("last", hash);
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button, a");
    if (!b) return;
    if (b.dataset.ov) { store.set("optview", b.dataset.ov); render(); }
    else if (b.dataset.kind) { caseFilter.kind = b.dataset.kind; render(); }
    else if (b.dataset.ctopic !== undefined) { caseFilter.topic = b.dataset.ctopic; render(); }
    else if (b.dataset.qkind !== undefined) { quizState.kind = b.dataset.qkind; reorder(); render(); }
    else if (b.id === "reveal") { quizState.shown = true; render(); }
    else if (b.id === "skip" || b.dataset.mark !== undefined) {
      if (b.dataset.mark !== undefined) { known[quizState.order[quizState.idx]] = b.dataset.mark === "1"; store.set("known", known); }
      quizState.idx = (quizState.idx + 1) % quizState.order.length; quizState.shown = false; render();
    }
    else if (b.id === "copyScript") {
      const txt = $("#scriptText").textContent;
      const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#scriptText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "已選取"; };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(() => { b.textContent = "已複製"; }, fallback); else fallback();
    }
    else if (b.id === "menubtn") $("#rail").classList.toggle("open");
    else if (b.id === "themebtn") {
      const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next; store.set("theme", next);
    }
    else if (b.matches('a[href^="#"]') && $("#q").value) { $("#q").value = ""; }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "doneBox") { const id = location.hash.slice(7); done[id] = e.target.checked; store.set("done", done); nav(location.hash.slice(1)); }
    if (e.target.id === "qtopic") { quizState.topic = e.target.value; reorder(); render(); }
  });
  let timer;
  $("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 150); });
  window.addEventListener("hashchange", render);

  const theme = store.get("theme", null);
  if (theme) document.documentElement.dataset.theme = theme;
  $("#stats").textContent = D.topics.length + " 個決策 ・ " + D.cases.length + " 個案例 ・ " + D.mechanisms.length + " 條機制 ・ " + D.quiz.length + " 題自測";
  if (!location.hash) { const last = store.get("last", null); if (last && last !== "home") { location.hash = last; return; } }
  render();
})();
</script>
