version: '3.8'

services:
  # =================================================================
  # INFRASTRUCTURE SERVICES
  # =================================================================
  
  # Zookeeper for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: dcard-lambda-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-logs:/var/lib/zookeeper/log
    networks:
      - lambda-network

  # Kafka for event streaming
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: dcard-lambda-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 128
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: 'lz4'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - lambda-network

  # ClickHouse for batch layer, speed layer, and serving layer
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    hostname: clickhouse
    container_name: dcard-lambda-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: dcard_lambda
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./serving-layer/clickhouse/ddl:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - lambda-network

  # Redis for serving layer caching
  redis:
    image: redis:7.2-alpine
    hostname: redis
    container_name: dcard-lambda-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - lambda-network

  # HDFS NameNode for data lake
  hdfs-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: hdfs-namenode
    container_name: dcard-lambda-hdfs-namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    environment:
      CLUSTER_NAME: dcard-lambda
      CORE_CONF_fs_defaultFS: hdfs://hdfs-namenode:8020
    volumes:
      - hdfs-namenode:/hadoop/dfs/name
    networks:
      - lambda-network

  # HDFS DataNode
  hdfs-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: hdfs-datanode
    container_name: dcard-lambda-hdfs-datanode
    depends_on:
      - hdfs-namenode
    ports:
      - "9864:9864"
    environment:
      CORE_CONF_fs_defaultFS: hdfs://hdfs-namenode:8020
    volumes:
      - hdfs-datanode:/hadoop/dfs/data
    networks:
      - lambda-network

  # =================================================================
  # BATCH LAYER
  # =================================================================

  # Spark Master for batch processing
  spark-master:
    image: bitnami/spark:3.5.0
    hostname: spark-master
    container_name: dcard-lambda-spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: no
      SPARK_RPC_ENCRYPTION_ENABLED: no
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: no
      SPARK_SSL_ENABLED: no
      SPARK_USER: spark
    volumes:
      - ./batch-layer/spark/target:/opt/spark-apps
      - ./data-lake:/opt/data-lake
    networks:
      - lambda-network

  # Spark Worker
  spark-worker:
    image: bitnami/spark:3.5.0
    hostname: spark-worker
    container_name: dcard-lambda-spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: 4
      SPARK_RPC_AUTHENTICATION_ENABLED: no
      SPARK_RPC_ENCRYPTION_ENABLED: no
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: no
      SPARK_SSL_ENABLED: no
      SPARK_USER: spark
    volumes:
      - ./batch-layer/spark/target:/opt/spark-apps
      - ./data-lake:/opt/data-lake
    networks:
      - lambda-network

  # =================================================================
  # SPEED LAYER
  # =================================================================

  # Flink JobManager for real-time processing
  flink-jobmanager:
    image: flink:1.18.0-scala_2.12
    hostname: flink-jobmanager
    container_name: dcard-lambda-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 128
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        high-availability: zookeeper
        high-availability.zookeeper.quorum: zookeeper:2181
        high-availability.storageDir: file:///opt/flink/ha
        state.ttl: 7d
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      - flink-ha:/opt/flink/ha
      - ./speed-layer/flink/target:/opt/flink/usrlib
    networks:
      - lambda-network

  # Flink TaskManager
  flink-taskmanager:
    image: flink:1.18.0-scala_2.12
    hostname: flink-taskmanager
    container_name: dcard-lambda-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: 2
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 128
        state.backend: rocksdb
        high-availability: zookeeper
        high-availability.zookeeper.quorum: zookeeper:2181
        state.ttl: 7d
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      - ./speed-layer/flink/target:/opt/flink/usrlib
    networks:
      - lambda-network

  # =================================================================
  # SERVING LAYER
  # =================================================================

  # Serving Layer API (Python FastAPI)
  serving-api:
    build:
      context: ./serving-layer/api
      dockerfile: Dockerfile
    hostname: serving-api
    container_name: dcard-lambda-serving-api
    depends_on:
      - clickhouse
      - redis
    ports:
      - "8000:8000"
    environment:
      SERVING_DEBUG: "false"
      SERVING_CLICKHOUSE_URL: "clickhouse://default@clickhouse:9000/dcard_lambda"
      SERVING_REDIS_HOST: "redis"
      SERVING_REDIS_PORT: "6379"
      SERVING_LOG_LEVEL: "INFO"
    volumes:
      - ./serving-layer/api/src:/app/src:ro
    networks:
      - lambda-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =================================================================
  # MONITORING
  # =================================================================

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.47.0
    hostname: prometheus
    container_name: dcard-lambda-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - lambda-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.1.0
    hostname: grafana
    container_name: dcard-lambda-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource,redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - lambda-network

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: dcard-lambda-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lambda-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - lambda-network

  # =================================================================
  # UTILITIES
  # =================================================================

  # Data Generator (for testing)
  data-generator:
    build:
      context: ./scripts/data-generator
      dockerfile: Dockerfile
    hostname: data-generator
    container_name: dcard-lambda-data-generator
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: user-posts
      GENERATION_RATE: 100  # events per second
    volumes:
      - ./scripts/data-generator:/app
    networks:
      - lambda-network
    profiles:
      - testing

volumes:
  # Infrastructure
  zk-data:
    driver: local
  zk-logs:
    driver: local
  kafka-data:
    driver: local
  clickhouse-data:
    driver: local
  clickhouse-logs:
    driver: local
  redis-data:
    driver: local

  # HDFS
  hdfs-namenode:
    driver: local
  hdfs-datanode:
    driver: local

  # Flink
  flink-checkpoints:
    driver: local
  flink-savepoints:
    driver: local
  flink-ha:
    driver: local

  # Monitoring
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  lambda-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16