# Speed Layer Configuration for Dcard Lambda Architecture

# Kafka Configuration
kafka {
    bootstrap.servers = "kafka:29092"
    topic = "user-posts"
    consumer.group.id = "speed-layer-consumer"
    auto.offset.reset = "latest"
    enable.auto.commit = false
    max.poll.records = 1000
    session.timeout.ms = 30000
    heartbeat.interval.ms = 10000
}

# Flink Configuration
flink {
    parallelism = 128
    checkpointing {
        interval = "30s"
        mode = "EXACTLY_ONCE"
        timeout = "5min"
        min-pause = "10s"
        max-concurrent = 1
    }
    
    state {
        backend = "rocksdb"
        incremental = true
        ttl = "7d"  # Speed layer only keeps recent data
        cleanup = "FULL_STATE_SCAN_SNAPSHOT"
    }
    
    watermark {
        idle-timeout = "30s"
        alignment {
            enabled = true
            timeout = "10s"
        }
    }
}

# Redis Configuration (for real-time caching)
redis {
    host = "redis"
    port = 6379
    database = 0
    timeout = 5000
    max-connections = 20
    min-connections = 5
    
    # Key patterns
    keys {
        user-count-prefix = "speed:user:"
        board-stats-prefix = "speed:board:"
        metrics-prefix = "speed:metrics:"
    }
    
    # TTL settings (in seconds)
    ttl {
        user-counts = 604800    # 7 days
        board-stats = 86400     # 1 day
        metrics = 3600          # 1 hour
    }
}

# ClickHouse Configuration (for speed layer storage)
clickhouse {
    url = "jdbc:clickhouse://clickhouse:8123/default"
    driver = "com.clickhouse.jdbc.ClickHouseDriver"
    user = "speed_user"
    password = "speed_password_2024"
    
    # Connection pool settings
    connection-pool {
        max-size = 10
        min-size = 2
        connection-timeout = 30000
        idle-timeout = 600000
    }
    
    # Batch settings
    batch {
        size = 5000
        flush-interval = "10s"
        max-retries = 3
        retry-delay = "5s"
    }
    
    # Tables
    tables {
        speed-counts = "user_post_counts_speed"
        board-stats = "board_stats_speed"
        realtime-metrics = "realtime_metrics"
    }
}

# Window Configuration
windows {
    # Tumbling windows for basic aggregation
    tumbling {
        size = "5min"
        allowed-lateness = "1min"
    }
    
    # Sliding windows for trend analysis
    sliding {
        size = "10min"
        slide = "2min"
        allowed-lateness = "1min"
    }
    
    # Session windows for user activity
    session {
        gap = "30min"
        max-duration = "4h"
    }
}

# Monitoring Configuration
monitoring {
    metrics {
        enabled = true
        interval = "10s"
        reporters = ["prometheus", "slf4j"]
    }
    
    alerts {
        enabled = true
        thresholds {
            high-latency = "5s"
            high-error-rate = "0.05"  # 5%
            checkpoint-failure-rate = "0.1"  # 10%
            backpressure-threshold = "0.8"   # 80%
        }
    }
}

# Resource Management
resources {
    memory {
        process-size = "2g"
        flink-size = "1.6g"
        managed-fraction = 0.4
        network-fraction = 0.1
    }
    
    # Task slots and parallelism
    task-slots = 4
    max-parallelism = 256
}

# Data Quality
data-quality {
    # Event validation rules
    validation {
        max-event-delay = "1h"
        required-fields = ["user_id", "post_id", "event_type", "timestamp"]
        valid-event-types = ["POST_CREATED", "POST_DELETED"]
    }
    
    # Dead letter queue configuration
    dlq {
        enabled = true
        topic = "user-posts-dlq"
        max-retries = 3
    }
}

# Performance Tuning
performance {
    # Network buffer settings
    network-buffers = {
        min = "64mb"
        max = "1gb"
        fraction = 0.1
    }
    
    # RocksDB tuning
    rocksdb {
        block-size = "64kb"
        block-cache-size = "256mb"
        write-buffer-size = "128mb"
        max-background-threads = 4
        compression = "LZ4"
    }
    
    # Kafka consumer tuning
    kafka-consumer {
        fetch-min-bytes = 1024
        fetch-max-wait = 500
        max-partition-fetch-bytes = 1048576
        receive-buffer-bytes = 65536
        send-buffer-bytes = 131072
    }
}